# Bases de datos para desarrollo local (DEP-DEV). Las credenciales salen de .env.
name: sitbio

services:
  postgres:
    image: postgres:16
    container_name: sitbio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/sitbio-db:ro
      - ./database/docker/postgres-init.sh:/docker-entrypoint-initdb.d/00-sitbio.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d sitbio_dev"]
      interval: 10s
      retries: 5

  mongo:
    image: mongo:7
    container_name: sitbio-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - ./database/02_MongoDB_SITBIO.js:/docker-entrypoint-initdb.d/02-sitbio.js:ro
      - ./database/V007__bitacora_acciones.js:/docker-entrypoint-initdb.d/07-bitacora-acciones.js:ro

  # Correo de pruebas (J-06): recibe los avisos de las solicitudes sin enviarlos a nadie.
  # Bandeja en http://localhost:5081; la API se conecta a localhost:2525 sin TLS (ver README).
  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: sitbio-smtp4dev
    restart: unless-stopped
    ports:
      - "5081:80"
      - "2525:25"

volumes:
  pgdata:
  mongodata:
